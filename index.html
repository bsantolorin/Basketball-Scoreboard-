    <head>

        <div class="container">
            <div>
                <h3 class="home">HOME</h3>
                <div>
                <p id="homescore-el" class="scorehome">0</p>
                </div>

                </div>
            </div>
            <div>
                <h3 class="guest">GUEST</h3>
                <div>
                <p id="guestscore-el" class="scoreguest">0</p>
                </div>
                <div class = "buttonguest">
                    <button class="plusonebtn" onclick="plusOneGuest()">+1</button>
                    <button class="plustwobtn" onclick="plusTwoGuest()">+2</button>
                    <button class="plusthreebtn" onclick="plusThreeGuest()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
